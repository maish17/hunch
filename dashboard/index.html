<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P4 Fleet Health</title>
  <link rel="icon" href="../site/assets/favicon-64.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    P4 fleet-health dashboard. Static page: no framework, no build step.
    Serve the REPO ROOT (make dashboard), then open http://localhost:8000/dashboard/
    The "Scenarios" button (source.js) generates and opens runs; it needs make dashboard's server.
    Data: a feed folder (feed_index.json + the files it lists). Default is a fixture; the
    menu also has generated runs (site/demo/generated/, from `make site-data`). Pass
    ?feed=../runs/<run_id>/dashboard/feed_index.json to view any run (`make detect` prints it).
    All maths is done in Python before the files are written; this page only draws.
  -->
  <header class="topbar">
    <div class="brand">P4 Fleet Health <span class="sub">LLASO predictive maintenance</span></div>
    <label class="feed-picker">Data
      <select id="feed-select">
        <option value="../fixtures/active_work_order/feed_index.json">Fixture: active work order</option>
        <option value="../fixtures/healthy_fleet/feed_index.json">Fixture: healthy fleet</option>
        <option value="../site/demo/generated/bearing_wear_p2_02/feed_index.json">Generated: bearing wear</option>
        <option value="../site/demo/generated/wheel_drag_p2_01/feed_index.json">Generated: wheel drag</option>
        <option value="../site/demo/generated/cooling_fault_p2_03/feed_index.json">Generated: cooling fault</option>
        <option value="../site/demo/generated/battery_degradation_p2_02/feed_index.json">Generated: battery degradation</option>
        <option value="../site/demo/generated/healthy_baseline/feed_index.json">Generated: healthy fleet</option>
      </select>
    </label>
    <button id="source-toggle" type="button" class="source-toggle" hidden>Scenarios</button>
    <div id="sim-clock" class="clock">-</div>
  </header>

  <!-- Scenarios panel (dashboard/source.js). Only appears when served by `make dashboard`. -->
  <section id="source-panel" class="source-panel" hidden>
    <div class="source-head"><strong>Scenarios</strong> <span id="source-status" class="small muted"></span></div>
    <ul id="source-list" class="source-list"></ul>
  </section>

  <nav class="tabs">
    <a href="#fleet" data-view="fleet">Fleet board</a>
    <a href="#robot" data-view="robot">Robot detail</a>
    <a href="#alerts" data-view="alerts">Alert feed</a>
    <a href="#workorders" data-view="workorders">Work orders</a>
  </nav>

  <main id="view">Loading...</main>

  <script src="app.js"></script>
  <script src="plot.js"></script>
  <script src="views/fleet.js"></script>
  <script src="views/robot.js"></script>
  <script src="views/alerts.js"></script>
  <script src="views/workorders.js"></script>
  <script src="source.js"></script>
  <script>P4.start(); P4.source.init();</script>
</body>
</html>
