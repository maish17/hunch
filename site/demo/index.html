<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respite Dashboard Demo</title>
  <link rel="icon" href="../assets/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <!--
    Showcase copy of the fleet dashboard, in the Respite brand.
    The JavaScript is NOT copied: this page loads ../../dashboard/*.js, so dashboard
    improvements appear here automatically. Data: generated/ holds real runs written by
    `make site-data` (re-run it after changing the model); ../../fixtures/ is hand-made.
    Only the look (demo.css), this header and the menu are specific to the website.
  -->
  <header class="topbar">
    <a class="brand" href="../" target="_top">
      <img src="../assets/logo-256.png" alt="" width="32" height="32">
      <span>Respite fleet dashboard</span>
    </a>
    <label class="feed-picker">Run
      <select id="feed-select">
        <optgroup label="Generated by our simulator, analysed by Respite">
          <option value="generated/bearing_wear_p2_02/feed_index.json">Wearing wheel bearing</option>
          <option value="generated/wheel_drag_p2_01/feed_index.json">Wheel clogged with regolith</option>
          <option value="generated/cooling_fault_p2_03/feed_index.json">Failing drive cooling</option>
          <option value="generated/battery_degradation_p2_02/feed_index.json">Ageing battery</option>
          <option value="generated/healthy_baseline/feed_index.json">Healthy fleet</option>
        </optgroup>
        <optgroup label="Hand-made example (work orders not built yet)">
          <option value="../../fixtures/active_work_order/feed_index.json">Robot in for repair</option>
        </optgroup>
      </select>
    </label>
    <p class="data-note">Simulated data</p>
    <div id="sim-clock" class="clock">-</div>
  </header>

  <nav class="tabs">
    <a href="#fleet" data-view="fleet">Fleet board</a>
    <a href="#robot" data-view="robot">Robot detail</a>
    <a href="#alerts" data-view="alerts">Alert feed</a>
    <a href="#workorders" data-view="workorders">Work orders</a>
  </nav>

  <main id="view">Loading...</main>

  <script src="../../dashboard/app.js"></script>
  <script src="../../dashboard/plot.js"></script>
  <script src="../../dashboard/views/fleet.js"></script>
  <script src="../../dashboard/views/robot.js"></script>
  <script src="../../dashboard/views/alerts.js"></script>
  <script src="../../dashboard/views/workorders.js"></script>
  <script>P4.start();</script>
</body>
</html>
